services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aifc
      POSTGRES_PASSWORD: aifc
      POSTGRES_DB: aifc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aifc"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://aifc:aifc@postgres:5432/aifc
      REDIS_URL: redis://redis:6379/0
      STORAGE_PATH: ${STORAGE_PATH:-/app/storage}
      STORAGE_TTL_DAYS: 7
      MODELS_PATH: ${MODELS_PATH:-/app/models}
      SEGMENTER_MODEL_PATH: ${SEGMENTER_MODEL_PATH:-/app/models/best.safetensors}
      SEGMENTER_MODEL_CONFIG_PATH: ${SEGMENTER_MODEL_CONFIG_PATH:-/app/models/config.yaml}
      SEGMENTER_MODEL_URL: ${SEGMENTER_MODEL_URL:-https://huggingface.co/Yytsi/floorplan-to-3d-walls/resolve/main/best.safetensors}
      SEGMENTER_MODEL_CONFIG_URL: ${SEGMENTER_MODEL_CONFIG_URL:-https://huggingface.co/Yytsi/floorplan-to-3d-walls/resolve/main/config.yaml}
      SEGMENTER_MODEL_INPUT_SIZE: ${SEGMENTER_MODEL_INPUT_SIZE:-512}
      PATH: /opt/libredwg/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      LD_LIBRARY_PATH: /opt/libredwg/lib
      DWG_CONVERTER_COMMAND: ${DWG_CONVERTER_COMMAND:-dwgwrite {input} {output}}
      CORS_ORIGINS: '["http://localhost:3000"]'
      DEBUG: "true"
    volumes:
      - ./backend:/app
      - ${STORAGE_VOLUME:-storage_data}:/app/storage
      - ${MODELS_VOLUME:-models_data}:/app/models
      - libredwg_root:/opt/libredwg:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://aifc:aifc@postgres:5432/aifc
      REDIS_URL: redis://redis:6379/0
      STORAGE_PATH: ${STORAGE_PATH:-/app/storage}
      STORAGE_TTL_DAYS: 7
      MODELS_PATH: ${MODELS_PATH:-/app/models}
      SEGMENTER_MODEL_PATH: ${SEGMENTER_MODEL_PATH:-/app/models/best.safetensors}
      SEGMENTER_MODEL_CONFIG_PATH: ${SEGMENTER_MODEL_CONFIG_PATH:-/app/models/config.yaml}
      SEGMENTER_MODEL_URL: ${SEGMENTER_MODEL_URL:-https://huggingface.co/Yytsi/floorplan-to-3d-walls/resolve/main/best.safetensors}
      SEGMENTER_MODEL_CONFIG_URL: ${SEGMENTER_MODEL_CONFIG_URL:-https://huggingface.co/Yytsi/floorplan-to-3d-walls/resolve/main/config.yaml}
      SEGMENTER_MODEL_INPUT_SIZE: ${SEGMENTER_MODEL_INPUT_SIZE:-512}
      PATH: /opt/libredwg/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      LD_LIBRARY_PATH: /opt/libredwg/lib
      DWG_CONVERTER_COMMAND: ${DWG_CONVERTER_COMMAND:-dwgwrite {input} {output}}
      JOB_STALE_TIMEOUT_SECONDS: ${JOB_STALE_TIMEOUT_SECONDS:-300}
    volumes:
      - ./backend:/app
      - ${STORAGE_VOLUME:-storage_data}:/app/storage
      - ${MODELS_VOLUME:-models_data}:/app/models
      - libredwg_root:/opt/libredwg:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app worker --loglevel=info
    mem_limit: ${WORKER_MEM_LIMIT:-4g}
    memswap_limit: ${WORKER_MEMSWAP_LIMIT:-6g}

  beat:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://aifc:aifc@postgres:5432/aifc
      REDIS_URL: redis://redis:6379/0
      STORAGE_PATH: ${STORAGE_PATH:-/app/storage}
      STORAGE_TTL_DAYS: 7
      MODELS_PATH: ${MODELS_PATH:-/app/models}
      SEGMENTER_MODEL_PATH: ${SEGMENTER_MODEL_PATH:-/app/models/best.safetensors}
      SEGMENTER_MODEL_CONFIG_PATH: ${SEGMENTER_MODEL_CONFIG_PATH:-/app/models/config.yaml}
      SEGMENTER_MODEL_URL: ${SEGMENTER_MODEL_URL:-https://huggingface.co/Yytsi/floorplan-to-3d-walls/resolve/main/best.safetensors}
      SEGMENTER_MODEL_CONFIG_URL: ${SEGMENTER_MODEL_CONFIG_URL:-https://huggingface.co/Yytsi/floorplan-to-3d-walls/resolve/main/config.yaml}
      SEGMENTER_MODEL_INPUT_SIZE: ${SEGMENTER_MODEL_INPUT_SIZE:-512}
      PATH: /opt/libredwg/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      LD_LIBRARY_PATH: /opt/libredwg/lib
      DWG_CONVERTER_COMMAND: ${DWG_CONVERTER_COMMAND:-dwgwrite {input} {output}}
      JOB_STALE_TIMEOUT_SECONDS: ${JOB_STALE_TIMEOUT_SECONDS:-300}
    volumes:
      - ./backend:/app
      - ${STORAGE_VOLUME:-storage_data}:/app/storage
      - ${MODELS_VOLUME:-models_data}:/app/models
      - libredwg_root:/opt/libredwg:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app beat --loglevel=info

  dwg-converter:
    build:
      context: ./backend
      dockerfile: Dockerfile.libredwg
    profiles:
      - dwg
    volumes:
      - ${STORAGE_VOLUME:-storage_data}:/app/storage
      - libredwg_root:/opt/libredwg

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  storage_data:
  models_data:
  libredwg_root: