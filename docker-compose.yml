services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aifc
      POSTGRES_PASSWORD: aifc
      POSTGRES_DB: aifc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aifc"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://aifc:aifc@postgres:5432/aifc
      REDIS_URL: redis://redis:6379/0
      STORAGE_PATH: ${STORAGE_PATH:-/app/storage}
      STORAGE_TTL_DAYS: 7
      MODELS_PATH: ${MODELS_PATH:-/app/models}
      DWG_CONVERTER_COMMAND: ${DWG_CONVERTER_COMMAND:-}
      CORS_ORIGINS: '["http://localhost:3000"]'
      DEBUG: "true"
    volumes:
      - ./backend:/app
      - ${STORAGE_VOLUME:-storage_data}:/app/storage
      - ${MODELS_VOLUME:-models_data}:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://aifc:aifc@postgres:5432/aifc
      REDIS_URL: redis://redis:6379/0
      STORAGE_PATH: ${STORAGE_PATH:-/app/storage}
      STORAGE_TTL_DAYS: 7
      MODELS_PATH: ${MODELS_PATH:-/app/models}
      DWG_CONVERTER_COMMAND: ${DWG_CONVERTER_COMMAND:-}
      JOB_STALE_TIMEOUT_SECONDS: ${JOB_STALE_TIMEOUT_SECONDS:-300}
    volumes:
      - ./backend:/app
      - ${STORAGE_VOLUME:-storage_data}:/app/storage
      - ${MODELS_VOLUME:-models_data}:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app worker --loglevel=info
    mem_limit: ${WORKER_MEM_LIMIT:-4g}
    memswap_limit: ${WORKER_MEMSWAP_LIMIT:-6g}

  beat:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://aifc:aifc@postgres:5432/aifc
      REDIS_URL: redis://redis:6379/0
      STORAGE_PATH: ${STORAGE_PATH:-/app/storage}
      STORAGE_TTL_DAYS: 7
      MODELS_PATH: ${MODELS_PATH:-/app/models}
      DWG_CONVERTER_COMMAND: ${DWG_CONVERTER_COMMAND:-}
      JOB_STALE_TIMEOUT_SECONDS: ${JOB_STALE_TIMEOUT_SECONDS:-300}
    volumes:
      - ./backend:/app
      - ${STORAGE_VOLUME:-storage_data}:/app/storage
      - ${MODELS_VOLUME:-models_data}:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app beat --loglevel=info

  dwg-converter:
    image: alpine:3.20
    profiles:
      - dwg
    volumes:
      - ${STORAGE_VOLUME:-storage_data}:/app/storage
    command: sh -c "echo 'Mount ODA FileConverter or libredwg here for DWG_CONVERTER_COMMAND' && tail -f /dev/null"

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  storage_data:
  models_data: