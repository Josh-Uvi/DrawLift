services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aifc
      POSTGRES_PASSWORD: aifc
      POSTGRES_DB: aifc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aifc"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://aifc:aifc@postgres:5432/aifc
      REDIS_URL: redis://redis:6379/0
      STORAGE_PATH: /app/storage
      MODELS_PATH: /app/models
      CORS_ORIGINS: '["http://localhost:3000"]'
      DEBUG: "true"
    volumes:
      - ./backend:/app
      - storage_data:/app/storage
      - models_data:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://aifc:aifc@postgres:5432/aifc
      REDIS_URL: redis://redis:6379/0
      STORAGE_PATH: /app/storage
      MODELS_PATH: /app/models
    volumes:
      - ./backend:/app
      - storage_data:/app/storage
      - models_data:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app worker --loglevel=info

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  storage_data:
  models_data: