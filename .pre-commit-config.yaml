repos:
  - repo: local
    hooks:
      - id: backend-ruff
        name: Backend lint and format check (ruff)
        entry: bash -c 'cd backend && ruff check . && ruff format --check .'
        language: system
        pass_filenames: false

      - id: backend-mypy
        name: Backend type check (mypy)
        entry: bash -c 'cd backend && mypy app'
        language: system
        pass_filenames: false

      - id: frontend-eslint
        name: Frontend lint (ESLint)
        entry: >-
          bash -c 'cd frontend && created=0;
          if [ ! -x node_modules/.bin/eslint ] || [ ! -x node_modules/.bin/prettier ]; then
            npm ci --no-audit --no-fund && created=1;
          fi;
          npm run lint;
          status=$?;
          if [ "$created" -eq 1 ]; then rm -rf node_modules; fi;
          exit $status'
        language: system
        pass_filenames: false
        require_serial: true

      - id: frontend-prettier
        name: Frontend format check (Prettier)
        entry: >-
          bash -c 'cd frontend && created=0;
          if [ ! -x node_modules/.bin/prettier ] || [ ! -x node_modules/.bin/eslint ]; then
            npm ci --no-audit --no-fund && created=1;
          fi;
          npm run format:check;
          status=$?;
          if [ "$created" -eq 1 ]; then rm -rf node_modules; fi;
          exit $status'
        language: system
        pass_filenames: false
        require_serial: true