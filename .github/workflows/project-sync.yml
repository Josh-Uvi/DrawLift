# .github/workflows/project-sync.yml
# ----------------------------------------------------------------------------
# Automatically move issue cards on the "AI File Converter" GitHub Project
# when activity happens. The goal: any push or PR that touches an issue should
# move its card to the correct column on the board without human intervention.
#
#   - Issue opened / reopened   -> Todo
#   - PR opened (closes #N)     -> In Progress
#   - PR merged / closed        -> Done (auto-closes linked issues)
#   - Commit pushed to main that contains "Closes #N" / "Fixes #N" -> Done
#   - Issue closed              -> Done
#
# Uses curl + jq directly (no actions/github-script) to avoid Node 20
# deprecation warnings and give full control over error handling.
# ----------------------------------------------------------------------------
name: Project Sync

on:
  issues:
    types: [opened, reopened, closed, edited]
  pull_request:
    types: [opened, reopened, closed, synchronize, edited]
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write
  projects: write

jobs:
  sync-project:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Sync issue/PR to project board
        env:
          PROJECT_NUMBER: "1"
          PROJECT_OWNER: "Josh-Uvi"
        run: |
          set -uo pipefail

          # ----------------------------------------------------------------
          # Configuration
          # ----------------------------------------------------------------
          STATUS_FIELD_NAME="Status"
          COL_TODO="Todo"
          COL_PROGRESS="In Progress"
          COL_DONE="Done"
          API_URL="https://api.github.com/graphql"

          # ----------------------------------------------------------------
          # Helper: execute a GraphQL query/mutation via curl
          # ----------------------------------------------------------------
          graphql() {
            local query="$1"
            local vars="$2"
            local payload
            payload=$(jq -n --arg q "$query" --argjson v "$vars" '{query: $q, variables: $v}')
            curl -s --retry 3 -X POST "$API_URL" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$payload"
          }

          # ----------------------------------------------------------------
          # 1) Query project + status field + option IDs
          # ----------------------------------------------------------------
          QUERY='query($login: String!, $number: Int!) {
            user(login: $login) {
              projectV2(number: $number) {
                id
                fields(first: 50) {
                  nodes {
                    ... on ProjectV2SingleSelectField {
                      id
                      name
                      options { id name }
                    }
                  }
                }
              }
            }
          }'

          VARS=$(jq -n --arg login "$PROJECT_OWNER" --argjson number "$PROJECT_NUMBER" '{login: $login, number: $number}')
          RESULT=$(graphql "$QUERY" "$VARS")

          # Check for GraphQL errors
          ERRORS=$(echo "$RESULT" | jq -r '.errors[0].message // empty')
          if [ -n "$ERRORS" ]; then
            echo "::warning::GraphQL error: $ERRORS"
            echo "::warning::If using GITHUB_TOKEN, set a PROJECT_TOKEN secret with a PAT that has 'project' scope."
            exit 0
          fi

          PROJECT_ID=$(echo "$RESULT" | jq -r '.data.user.projectV2.id // empty')
          if [ -z "$PROJECT_ID" ] || [ "$PROJECT_ID" = "null" ]; then
            echo "::warning::Project #$PROJECT_NUMBER not found for user '$PROJECT_OWNER'."
            echo "::warning::If using GITHUB_TOKEN, set a PROJECT_TOKEN secret with a PAT that has 'project' scope."
            exit 0
          fi

          echo "Found project: $PROJECT_ID"

          # Get status field ID
          STATUS_FIELD_ID=$(echo "$RESULT" | jq -r --arg name "$STATUS_FIELD_NAME" \
            '.data.user.projectV2.fields.nodes[] | select(.name == $name) | .id' | head -1)

          if [ -z "$STATUS_FIELD_ID" ]; then
            echo "::warning::Project has no \"$STATUS_FIELD_NAME\" field"
            exit 0
          fi

          # Helper: get option ID by name
          get_opt() {
            echo "$RESULT" | jq -r --arg name "$1" \
              '.data.user.projectV2.fields.nodes[] | select(.name == "Status") | .options[] | select(.name == $name) | .id' | head -1
          }

          OPT_TODO=$(get_opt "$COL_TODO")
          OPT_PROGRESS=$(get_opt "$COL_PROGRESS")
          OPT_DONE=$(get_opt "$COL_DONE")

          # ----------------------------------------------------------------
          # 2) Helper functions
          # ----------------------------------------------------------------
          add_to_project() {
            local content_id="$1"
            local mutation='mutation($project: ID!, $content: ID!) {
              addProjectV2ItemById(input: {projectId: $project, contentId: $content}) {
                item { id }
              }
            }'
            local vars
            vars=$(jq -n --arg project "$PROJECT_ID" --arg content "$content_id" '{project: $project, content: $content}')
            local result
            result=$(graphql "$mutation" "$vars")
            echo "$result" | jq -r '.data.addProjectV2ItemById.item.id // empty'
          }

          find_existing_item() {
            local content_id="$1"
            local query='query($project: ID!) {
              node(id: $project) {
                ... on ProjectV2 {
                  items(first: 100) {
                    nodes { id content { ... on Issue { id } ... on PullRequest { id } } }
                  }
                }
              }
            }'
            local vars
            vars=$(jq -n --arg project "$PROJECT_ID" '{project: $project}')
            local result
            result=$(graphql "$query" "$vars")
            echo "$result" | jq -r --arg id "$content_id" \
              '.data.node.items.nodes[] | select(.content.id == $id) | .id' | head -1
          }

          set_status() {
            local item_id="$1"
            local option_id="$2"
            [ -z "$item_id" ] && return
            [ -z "$option_id" ] && return
            local mutation='mutation($project: ID!, $item: ID!, $field: ID!, $option: ID!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $project, itemId: $item,
                fieldId: $field, value: { singleSelectOptionId: $option }
              }) { projectV2Item { id } }
            }'
            local vars
            vars=$(jq -n --arg project "$PROJECT_ID" --arg item "$item_id" --arg field "$STATUS_FIELD_ID" --arg option "$option_id" \
              '{project: $project, item: $item, field: $field, option: $option}')
            local result
            result=$(graphql "$mutation" "$vars")
            if echo "$result" | jq -e '.errors' >/dev/null 2>&1; then
              echo "::warning::Could not set status: $(echo "$result" | jq -r '.errors[0].message // empty')"
            fi
          }

          # ----------------------------------------------------------------
          # 3) Determine target column from event
          # ----------------------------------------------------------------
          EVENT_NAME="$GITHUB_EVENT_NAME"
          EVENT_PATH="$GITHUB_EVENT_PATH"

          if [ "$EVENT_NAME" = "push" ]; then
            # Walk commit messages for "Closes #N" / "Fixes #N"
            MESSAGES=$(jq -r '.commits[].message // empty' "$EVENT_PATH")
            for num in $(echo "$MESSAGES" | grep -oiE '(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#[0-9]+' | grep -oE '[0-9]+' | sort -u); do
              echo "Processing issue #$num from commit message"
              ISSUE_JSON=$(curl -s --retry 3 \
                -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$num")
              ISSUE_STATE=$(echo "$ISSUE_JSON" | jq -r '.state // empty')
              ISSUE_NODE_ID=$(echo "$ISSUE_JSON" | jq -r '.node_id // empty')

              if [ -z "$ISSUE_NODE_ID" ]; then
                echo "::warning::Could not fetch issue #$num"
                continue
              fi

              if [ "$ISSUE_STATE" = "open" ]; then
                curl -s --retry 3 -X PATCH \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H "Content-Type: application/json" \
                  -d '{"state": "closed"}' \
                  "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$num" >/dev/null
              fi

              ITEM_ID=$(find_existing_item "$ISSUE_NODE_ID")
              [ -z "$ITEM_ID" ] && ITEM_ID=$(add_to_project "$ISSUE_NODE_ID")
              set_status "$ITEM_ID" "$OPT_DONE"
            done
            exit 0
          fi

          # For issues and PRs
          CONTENT_ID=""
          TARGET=""

          if [ "$EVENT_NAME" = "issues" ]; then
            CONTENT_ID=$(jq -r '.issue.node_id // empty' "$EVENT_PATH")
            ACTION=$(jq -r '.action // empty' "$EVENT_PATH")
            if [ "$ACTION" = "closed" ]; then
              TARGET="$OPT_DONE"
            else
              TARGET="$OPT_TODO"
            fi
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            CONTENT_ID=$(jq -r '.pull_request.node_id // empty' "$EVENT_PATH")
            ACTION=$(jq -r '.action // empty' "$EVENT_PATH")
            MERGED=$(jq -r '.pull_request.merged // false' "$EVENT_PATH")
            if [ "$MERGED" = "true" ] || [ "$ACTION" = "closed" ]; then
              TARGET="$OPT_DONE"
            else
              TARGET="$OPT_PROGRESS"
            fi
          fi

          [ -z "$CONTENT_ID" ] && exit 0
          [ -z "$TARGET" ] && exit 0

          # ----------------------------------------------------------------
          # 4) Apply: ensure card exists, then set Status
          # ----------------------------------------------------------------
          ITEM_ID=$(find_existing_item "$CONTENT_ID")
          [ -z "$ITEM_ID" ] && ITEM_ID=$(add_to_project "$CONTENT_ID")
          set_status "$ITEM_ID" "$TARGET"

          echo "Synced item to project board"