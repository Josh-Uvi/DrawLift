# .github/workflows/project-sync.yml
# ----------------------------------------------------------------------------
# Automatically move issue cards on the "AI File Converter" GitHub Project
# when activity happens. The goal: any push or PR that touches an issue should
# move its card to the correct column on the board without human intervention.
#
#   - Issue opened / reopened   -> Todo
#   - PR opened (closes #N)     -> In Progress  (and adds status:in-review)
#   - PR merged / closed        -> Done         (auto-closes linked issues)
#   - Commit pushed to main that contains "Closes #N" / "Fixes #N" -> Done
#   - Issue closed              -> Done
# ----------------------------------------------------------------------------
name: Project Sync

on:
  issues:
    types: [opened, reopened, closed, edited]
  pull_request:
    types: [opened, reopened, closed, synchronize, edited]
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  sync-project:
    runs-on: ubuntu-latest
    steps:
      - name: Sync issue/PR to project board
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            // ----------------------------------------------------------------
            // Configuration: project + status field + option ids
            // ----------------------------------------------------------------
            const PROJECT_NUMBER   = 1;
            const PROJECT_OWNER    = 'Josh-Uvi';
            const STATUS_FIELD     = 'Status';
            const COLUMN_TODO      = 'Todo';
            const COLUMN_PROGRESS  = 'In Progress';
            const COLUMN_REVIEW    = 'Done';     // we use "Done" for in-review too
            const COLUMN_DONE      = 'Done';
            // ----------------------------------------------------------------
            // 1) Find the project + the Status field + each option id
            // ----------------------------------------------------------------
            const projectQuery = `
              query($login: String!, $number: Int!) {
                user(login: $login) {
                  projectV2(number: $number) {
                    id
                    fields(first: 50) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options { id name }
                        }
                      }
                    }
                  }
                }
              }`;
            const proj = await github.graphql(projectQuery, {
              login: PROJECT_OWNER, number: PROJECT_NUMBER,
            });
            const projectId = proj.user.projectV2.id;
            const statusField = proj.user.projectV2.fields.nodes
              .find(f => f.name === STATUS_FIELD);
            if (!statusField) {
              core.warning(`Project ${PROJECT_NUMBER} has no "${STATUS_FIELD}" field`);
              return;
            }
            const opt = name => statusField.options.find(o => o.name === name);
            const OPT = {
              todo:     opt(COLUMN_TODO)?.id,
              progress: opt(COLUMN_PROGRESS)?.id,
              done:     opt(COLUMN_DONE)?.id,
            };

            // ----------------------------------------------------------------
            // 2) Helper: add an issue/PR to the project (no-op if already there)
            // ----------------------------------------------------------------
            async function addToProject(contentId) {
              const mutation = `
                mutation($project: ID!, $content: ID!) {
                  addProjectV2ItemById(input: {projectId: $project, contentId: $content}) {
                    item { id }
                  }
                }`;
              try {
                const r = await github.graphql(mutation, {project: projectId, content: contentId});
                return r.addProjectV2ItemById.item.id;
              } catch (e) {
                // item may already exist
                return null;
              }
            }

            async function setStatus(itemId, optionId) {
              if (!itemId || !optionId) return;
              const mutation = `
                mutation($project: ID!, $item: ID!, $field: ID!, $option: ID!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $project, itemId: $item,
                    fieldId: $field, value: { singleSelectOptionId: $option }
                  }) { projectV2Item { id } }
                }`;
              try {
                await github.graphql(mutation, {
                  project: projectId, item: itemId,
                  field: statusField.id, option: optionId,
                });
              } catch (e) {
                core.warning(`Could not set status: ${e.message}`);
              }
            }

            async function findExistingItem(contentId) {
              const q = `
                query($project: ID!) {
                  node(id: $project) {
                    ... on ProjectV2 {
                      items(first: 100) {
                        nodes { id content { ... on Issue { id } ... on PullRequest { id } } }
                      }
                    }
                  }
                }`;
              const r = await github.graphql(q, {project: projectId});
              return r.node.items.nodes.find(n => n.content?.id === contentId)?.id || null;
            }

            // ----------------------------------------------------------------
            // 3) Decide target column from the event payload
            // ----------------------------------------------------------------
            const event = context.eventName;
            let contentId, action, target;

            if (event === 'issues') {
              contentId = context.payload.issue.node_id;
              action = context.payload.action;            // opened|reopened|closed|edited
              target = action === 'closed' ? OPT.done
                     : (action === 'reopened' ? OPT.todo : OPT.todo);
            } else if (event === 'pull_request') {
              contentId = context.payload.pull_request.node_id;
              const a = context.payload.action;           // opened|reopened|closed|...
              const merged = context.payload.pull_request.merged === true;
              if (merged || a === 'closed') {
                target = OPT.done;
              } else {
                target = OPT.progress;
              }
            } else if (event === 'push') {
              // Walk the commit messages looking for issue references like
              // "Closes #12" or "Fixes #34" and close them -> Done.
              const re = /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi;
              const messages = (context.payload.commits || []).map(c => c.message).join('\n');
              const matches = [...new Set([...messages.matchAll(re)].map(m => parseInt(m[1], 10)))];
              for (const num of matches) {
                try {
                  const { data: issue } = await github.rest.issues.get({
                    owner: context.repo.owner, repo: context.repo.repo, issue_number: num,
                  });
                  if (issue.state === 'open') {
                    await github.rest.issues.update({
                      owner: context.repo.owner, repo: context.repo.repo,
                      issue_number: num, state: 'closed',
                    });
                  }
                  const id = issue.node_id;
                  const itemId = (await findExistingItem(id)) || (await addToProject(id));
                  await setStatus(itemId, OPT.done);
                } catch (e) {
                  core.warning(`Push handler failed for #${num}: ${e.message}`);
                }
              }
              return;
            } else {
              return;
            }

            if (!contentId) return;

            // ----------------------------------------------------------------
            // 4) Apply: ensure the card exists on the board, then set Status
            // ----------------------------------------------------------------
            const itemId = (await findExistingItem(contentId)) || (await addToProject(contentId));
            await setStatus(itemId, target);
            core.info(`Moved ${contentId} to ${Object.keys(OPT).find(k => OPT[k] === target)}`);
